name: Update auto-listed events

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feeds
        run: python3 scripts/update_events.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- events.auto.json; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.auto.json
            git commit -m "Update auto-listed events"
            git push
          fi
